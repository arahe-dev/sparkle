# Build a prebuilt pack (image.sqfs + seed.tar) from an OCI image and publish it as a release,
# so `sparkle add` downloads it instead of building on the user's PC. Same proto/build-fixtures.sh
# the benchmarks and the local build use.
name: pack
on:
  workflow_dispatch:
    inputs:
      name:
        description: pack name (pointer release is pack-<name>)
        default: ros
      image:
        description: OCI image ref (linux/amd64)
        default: ros:jazzy-ros-base
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ inputs.name }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: tools (mksquashfs 4.6, crane, the benchmarks' static busybox)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq squashfs-tools
          mksquashfs -version | head -1
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          # The same busybox v1.38 musl binary the benchmarks used (sha256 in bench/results S10),
          # from busybox:musl pinned by digest. All applets are hard links to it; take the first.
          mkdir bb && ./crane export --platform linux/amd64 busybox@sha256:c9ad541b61c139f331017a452efb032bfd31631602df83de77a73edcb59b0a41 - | tar -xf - -C bb bin
          cp 'bb/bin/[' busybox && chmod 755 busybox
          echo "3d366d1a2e500f188f0fe72e5fa2020db800c3f1654c697e55026c565f642a42  busybox" | sha256sum -c
          # Every applet the pack runs before /usr exists (proto/stub/init.sh, mount, prewarm.sh).
          ./busybox --list > applets.txt
          for a in sh grep cat usleep dd od tr rm mkdir cp mount awk ln nice find xargs tail; do
            grep -qx "$a" applets.txt || { echo "busybox lacks $a"; exit 1; }
          done
      - name: pull and flatten
        run: |
          ./crane digest --platform linux/amd64 "$IMAGE" | tee digest.txt
          ./crane pull --platform linux/amd64 "$IMAGE@$(cat digest.txt)" image.tar
          sudo mkdir -p /mnt/tree
          ./crane export - - < image.tar | sudo tar -xpf - -C /mnt/tree --numeric-owner --xattrs --xattrs-include='*'
      - name: build image + seed
        run: |
          sudo sh proto/build-fixtures.sh setup /mnt/tree "$PWD/out"
          sudo sh proto/build-fixtures.sh sparkle /mnt/tree "$PWD/out" "$PWD/busybox"
          sudo chown -R "$USER" out
          {
            printf '%s@%s\n' "${IMAGE%%@*}" "$(cat digest.txt)"
            echo "commit=$GITHUB_SHA run=$GITHUB_RUN_ID"
            echo "busybox=$(./busybox | head -1) sha256=$(sha256sum < busybox | cut -c1-64)"
            echo "mksquashfs=$(mksquashfs -version | head -1)"
          } > out/source.txt
          cd out && sha256sum image.sqfs seed.tar source.txt > SHA256SUMS && cat SHA256SUMS source.txt && ls -l
      - name: release
        # Each build gets its own release, never changed afterwards. Only once all its files are up
        # does the pointer release pack-<name> get a new LATEST (one small file), so a user in the
        # middle of a download never sees a half-replaced set.
        run: |
          tag="pack-$NAME-$(cut -c8-19 digest.txt)-r$GITHUB_RUN_NUMBER"
          src=$(head -1 out/source.txt)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release create "$tag" out/image.sqfs out/seed.tar out/source.txt out/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "pack: $NAME ($tag)" \
            --notes "Prebuilt Sparkle pack '$NAME' from $src, built by $run_url from commit $GITHUB_SHA. Build details in source.txt."
          ptr="pack-$NAME"
          gh release view "$ptr" >/dev/null 2>&1 || gh release create "$ptr" --target "$GITHUB_SHA" --prerelease \
            --title "pack: $NAME (latest)" --notes "Pointer for 'sparkle add $NAME'."
          echo "$tag" > LATEST
          gh release upload "$ptr" LATEST --clobber
          gh release edit "$ptr" --notes "Pointer for 'sparkle add $NAME': LATEST names the release with the current build ($tag, $run_url)."
          # Files from before the pointer scheme, if any.
          for f in image.sqfs seed.tar source.txt SHA256SUMS; do gh release delete-asset "$ptr" "$f" -y 2>/dev/null || true; done
